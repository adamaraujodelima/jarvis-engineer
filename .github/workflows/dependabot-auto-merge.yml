name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'adamaraujodelima/jarvis-engineer'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Allowlist: only minor/patch bumps in the github-actions and gomod
      # ecosystems are auto-merged. Anything else (major bumps, docker, any
      # ecosystem added later, or an empty output) is left for manual review.
      # package-ecosystem is the Dependabot branch-name segment
      # (dependabot/<ecosystem>/...), so it is github_actions / go_modules, not
      # the dependabot.yml spellings. Auto-merge only waits for the checks
      # required by branch protection on master (`go` and `image`); without
      # them it merges immediately.
      - name: Enable auto-merge for minor/patch in github-actions and gomod
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.package-ecosystem == 'go_modules')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

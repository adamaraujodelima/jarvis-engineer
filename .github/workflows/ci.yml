name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module has no go.sum, so there is nothing to key a cache on.
          cache: false
      - run: go build ./... && go vet ./...

  # Generator tests and the drift gate for the kit content generated from
  # shared/. Needs only bash and POSIX tools; the macOS leg also runs the tests
  # under the system /bin/bash (3.2), which the generator must support.
  sync:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify-sync
      - run: make verify-make
      - name: Generator tests under bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-sync-agents.sh

  # What runs where: `go` builds and vets the module, `sync` runs the generator
  # tests, the drift gate and the Makefile dispatch tests, and `image` builds
  # each agent's sandbox template and runs its static image acceptance checks.
  # verify-kits.sh and verify-sandbox*.sh are not run: they need the sbx CLI,
  # which is not available on GitHub-hosted runners.
  image:
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ${{ matrix.agent }} image
        run: make build ${{ matrix.agent }}
      - name: Verify ${{ matrix.agent }} image
        run: make verify-image ${{ matrix.agent }}

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The module has no go.sum, so there is nothing to key a cache on.
          cache: false
      - run: go build ./... && go vet ./...

  # Builds the sandbox template and runs the static image acceptance checks.
  # verify-kits.sh and verify-sandbox.sh are not run: they need the sbx CLI,
  # which is not available on GitHub-hosted runners.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: make build
      - name: Verify image
        run: make verify-image

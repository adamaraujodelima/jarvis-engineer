schemaVersion: "2"
kind: sandbox
name: jarvis-engineer-codex
extends: codex
displayName: Jarvis Engineer (Codex)
description: "Senior Software Engineer responsible for orchestrating agents according to the role and responsibilities of an engineer, on Codex."

sandbox:
  # Without this, the kit falls back to the stock Codex image, which carries
  # neither ai-memory nor the MySQL MCP server.
  image: jarvis-engineer-codex:latest
  # Appended to the built-in codex entrypoint, which already runs Codex with
  # approvals and its own sandbox off (sbx is the sandbox). Codex's default
  # model is rejected for ChatGPT-account logins, so pin one that is accepted.
  command:
    - "--model"
    - "gpt-5.6-terra"

# The orchestrator role, sub-agents, rules and skills under files/home are
# generated from shared/ by scripts/sync-agents.sh: .codex/AGENTS.md is loaded
# as the global instructions, .codex/agents/*.toml are the sub-agents, and
# .agents/skills are the skills. Never hand-edit them.

permissions:
  network:
    # Merged with the built-in codex kit's list (OpenAI and ChatGPT endpoints).
    allow:
      # --- base: identical in every kit ------------------------------------
      # host.docker.internal covers MySQL: the MCP server dials
      # host.docker.internal:3306 directly, so no loopback rule is needed.
      - "host.docker.internal"
      - "gateway.docker.internal"
      - "github.com"
      - "api.github.com"
      - "raw.githubusercontent.com"
      - "objects.githubusercontent.com"
      - "proxy.golang.org"
      # --- code-writing kits only ------------------------------------------
      - "registry.npmjs.org"
      - "registry.yarnpkg.com"

# --- shared ai-memory block ---------------------------------------------
# Duplicated in the Claude and Codex kits. It cannot be factored into a
# parent kit: `extends` only resolves built-in agents, and pointing it at a
# local kit yields an empty parent while `sbx kit validate` still reports VALID.
# scripts/verify-kits.sh asserts what must stay identical across the two.

environment:
  variables:
    # Redirect the store off the container's ephemeral filesystem and onto the
    # volume below. Not under /home/agent: home-mounted volumes come up
    # root:root, and agent config there is reset on sandbox creation anyway.
    AI_MEMORY_DATA_DIR: /var/lib/ai-memory

volumes:
  - path: /var/lib/ai-memory
    size: 5g
    mode: "0755"

setup:
  install:
    # Volumes are mounted before install runs, and install runs as root, so this
    # is the only place the volume's root:root ownership can be handed over.
    - command: "chown 1000:1000 /var/lib/ai-memory"
      description: Give the agent user ownership of the memory volume

  startup:
    # The store now outlives the container, so a serve lock can survive an
    # unclean stop. Every start is a fresh PID namespace, so any lock still on
    # the volume at this point is by definition stale.
    - command:
        [
          "sh",
          "-c",
          "rm -f /var/lib/ai-memory/.serve.lock /var/lib/ai-memory/.serve.lock.holder",
        ]
      description: Clear a serve lock left behind by an unclean shutdown

    - command: ["ai-memory", "init"]
      description: Ensure the data directory layout exists

    # sbx writes ~/.codex/config.toml at sandbox creation (model provider, MCP
    # gateway), so MCP and hook registration cannot be baked into the image and
    # must re-run here. Both merge into the existing files and are idempotent.
    - command: ["ai-memory", "install-mcp", "--client", "codex", "--apply"]
      description: Register the ai-memory MCP server with Codex

    - command: ["ai-memory", "install-hooks", "--agent", "codex", "--apply"]
      description: Register ai-memory lifecycle hooks with Codex

    # Codex runs a hook only once its exact definition is trusted, and the trust
    # lives in the config.toml sbx recreates. This trusts ai-memory's hooks and
    # nothing else, using the hashes the installed Codex computes. Wrapped so a
    # failure only warns: a non-zero startup step silently aborts every later
    # step, and the agent still works without memory capture.
    - command:
        [
          "sh",
          "-c",
          "trust-codex-hooks || echo 'hooks: could not trust the ai-memory hooks; memory capture is off' >&2; exit 0",
        ]
      description: Trust the ai-memory hooks for Codex

    # Must be backgrounded: startup steps run sequentially to completion, so a
    # foreground server would block sandbox startup forever.
    - command:
        [
          "ai-memory",
          "serve",
          "--transport",
          "http",
          "--bind",
          "127.0.0.1:49374",
        ]
      background: true
      description: Run the ai-memory MCP server on loopback

    # `background: true` means the agent would otherwise launch while the server
    # is still binding, and its MCP connection would fail. Later startup steps
    # run only after this one returns, so polling here gates the agent on
    # readiness. Bounded and always exits 0: a server that never comes up must
    # degrade to "memory unavailable", not "sandbox will not start".
    - command:
        [
          "sh",
          "-c",
          'for i in $(seq 1 30); do curl -fsS -o /dev/null -X POST -H ''Content-Type: application/json'' -H ''Accept: application/json, text/event-stream'' -d ''{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"startup","version":"0"}}}'' http://127.0.0.1:49374/mcp && exit 0; sleep 1; done; echo ''ai-memory: server not ready after 30s; continuing without memory'' >&2; exit 0',
        ]
      description: Wait for the ai-memory server to accept MCP requests

    # --- mysql -----------------------------------------------------------
    # The MCP server dials host.docker.internal:3306 directly -- the allowlist
    # above names that host. Codex passes no environment to stdio MCP servers
    # unless told to: `env_vars` forwards the credentials by name from the
    # sandbox environment, so no credential value is ever written into
    # ~/.codex/config.toml. Supply them at creation time:
    #   sbx create --env-file .env --kit agent-codex jarvis-engineer-codex .
    # Written as TOML directly because `codex mcp add` can only set values.
    - command:
        - "sh"
        - "-c"
        - |
          CONFIG=/home/agent/.codex/config.toml

          if [ -z "$MYSQL_USER" ]; then
            echo "mysql: MYSQL_USER unset, skipping registration (pass --env-file)" >&2
            exit 0
          fi
          # Startup steps re-run on every start; the table must appear once.
          if grep -q '^\[mcp_servers\.mysql\]' "$CONFIG" 2>/dev/null; then
            exit 0
          fi

          mkdir -p /home/agent/.codex
          cat >>"$CONFIG" <<'TOML' || echo "mysql: MCP registration failed" >&2

          [mcp_servers.mysql]
          command = "npx"
          args = ["-y", "@benborla29/mcp-server-mysql"]
          env_vars = ["MYSQL_USER", "MYSQL_PASS"]

          [mcp_servers.mysql.env]
          MYSQL_HOST = "host.docker.internal"
          MYSQL_PORT = "3306"
          ALLOW_INSERT_OPERATION = "false"
          ALLOW_UPDATE_OPERATION = "false"
          ALLOW_DELETE_OPERATION = "false"
          ALLOW_DDL_OPERATION = "false"
          TOML

          # A non-zero exit from any startup step silently aborts every later
          # step, so this must always succeed.
          exit 0
      description: Register the read-only MySQL MCP server with Codex

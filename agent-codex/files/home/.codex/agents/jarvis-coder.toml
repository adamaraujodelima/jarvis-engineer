# Code style and architecture

These are standards for the code and its design. They describe what a good
implementation should look like; agent workflow, scope, TDD sequencing, and
validation requirements belong in `CODER.md`.

The goal is code that is understandable, changeable, testable, and resilient.
Prefer the simplest design that makes the behavior and business rules clear.
These are principles, not mechanical rules: use judgment and follow the
language, framework, and repository conventions when they are more appropriate.

## Clean code

- Write code for the next reader. Names, types, module boundaries, and control
  flow should communicate intent without requiring the reader to reconstruct
  the design from implementation details.
- Keep each function, type, and module cohesive. It should have one focused
  purpose and one primary reason to change. “One responsibility” does not mean
  one line or one operation; related behavior should live together.
- Prefer simple, direct code over cleverness. Do not introduce a pattern,
  generic abstraction, or indirection without a concrete problem it solves.
- Minimize hidden state, surprising mutations, implicit control flow, and
  action-at-a-distance. Make important effects visible in names, return
  values, types, or explicit commands.
- Optimize for changeability: a likely change should be local, understandable,
  and isolated from unrelated modules.

### Names and types

- Use precise, domain-oriented names. Names should express meaning, not merely
  implementation role.
- Avoid vague names such as `data`, `info`, `thing`, `helper`, `manager`,
  `handler`, `utils`, and `process` unless their meaning is genuinely clear in
  context.
- Use consistent terminology for the same concept throughout the codebase.
  Prefer full words except for established language or domain conventions.
- Name booleans as predicates (`isActive`, `canRetry`, `hasAccess`) and
  commands as verbs. Make it clear whether an operation reads, mutates,
  persists, or sends something.
- Prefer explicit types at public boundaries and for non-obvious values. Do
  not use `any`, untyped values, or broad maps to avoid making a design
  decision.
- At dynamic or untrusted boundaries, validate data immediately and convert
  it to a typed internal representation.
- Make invalid states difficult to represent with enums, constrained
  constructors, value objects, and types that preserve units and invariants.

### Functions and control flow

- A function should operate at one level of abstraction, have a clear name,
  and do one cohesive job. There is no universal line-count limit; split it
  when it mixes abstraction levels, has multiple independent reasons to
  change, or contains a meaningful part that can be understood separately.
- Keep argument lists understandable. Group genuinely related values into a
  named type, but do not use parameter objects to hide an incoherent API.
- Keep queries side-effect free where practical. Make commands' effects
  explicit and predictable.
- Prefer guard clauses when they reduce nesting. Use `if/else`, `switch`,
  pattern matching, and loops when they express the logic most clearly. Do
  not replace clear branching with clever polymorphism or dispatch tables just
  to avoid an `if`.
- Keep nesting shallow through clear extraction and early returns, but do not
  enforce an arbitrary indentation or function-length limit.
- Handle meaningful cases deliberately. Use exhaustive matching where the
  language supports it, and make impossible states fail clearly rather than
  silently selecting a surprising fallback.
- Avoid boolean flags that make one function perform unrelated workflows.
- Avoid premature generalization. A small amount of duplication can be safer
  than a wrong abstraction; extract shared code when its behavior, invariant,
  and reason for change are truly shared.

### Comments and documentation

- Prefer expressive code to explanatory comments. Comments should explain
  why a non-obvious decision exists, an invariant, a compatibility constraint,
  or an external-system limitation.
- Do not write comments that merely restate the code. Update or remove stale
  comments when behavior changes.
- Document public APIs with their purpose, inputs, outputs, side effects,
  errors, lifecycle expectations, and important invariants. Add examples when
  they clarify the contract.
- Link to an issue, specification, or upstream constraint when it explains a
  decision that future maintainers may otherwise undo.

## Architecture and modularity

- Keep public APIs small and intentional. Export only what callers need and
  keep implementation details private.
- Organize larger systems around features or domain capabilities when that
  improves cohesion. Do not create large technical-layer packages that make a
  single feature span many unrelated locations.
- Keep modules cohesive and avoid cycles. If two modules need each other,
  revisit ownership or introduce a narrow boundary owned by the caller.
- Prefer deep, useful modules: hide substantial implementation complexity
  behind a small, stable interface. Do not split code into shallow modules
  whose interfaces and wiring are more complex than the behavior they hide.
- Do not require every package to export an interface. Use an abstraction when
  it protects policy from a volatile detail, enables a real alternative, or
  materially improves testability. Prefer concrete types internally when no
  boundary requires indirection.
- Do not wrap every third-party library automatically. Create a project-owned
  boundary when vendor coupling, portability, domain translation, or
  testability justifies it.

### Dependency direction

Business policy should not depend on delivery mechanisms or infrastructure:

```text
frameworks / drivers / delivery / persistence
                    ↓
             application use cases
                    ↓
              domain policy and rules
```

Arrows represent dependencies. Inner policy must not import outer details such
as web frameworks, databases, queues, filesystems, clocks, or vendor SDKs.
Put those details behind ports/interfaces owned by the policy layer and
implement them in outer adapters. The exact number of layers is flexible; the
direction and ownership of the boundary are what matter.

- Keep the core usable without starting a server or connecting to a database.
- Assemble concrete dependencies at the application's composition root.
- Do not hide dependencies in service locators, mutable globals, or
  constructors with surprising side effects.
- Use dependency injection for resources that must vary, be replaced in
  tests, or be controlled by the application. Pure functions need no
  injection ceremony.
- Make transactions, retries, timeouts, idempotency, and concurrency
  boundaries explicit where they affect business behavior.

## Errors and invariants

- Validate untrusted input at system boundaries, then pass typed and
  normalized values inward. Enforce domain invariants wherever they could be
  violated by another caller.
- Treat expected failures as part of the API. Use typed/domain errors that
  callers can handle rather than undocumented error strings.
- Add context where an error gains meaning and preserve its original cause or
  stack. Do not swallow errors or catch broadly without a recovery strategy.
- Distinguish invalid input, conflicts, unavailable dependencies, programmer
  errors, and unexpected failures. Translate them to user/API responses at
  the outer boundary.
- Error messages should identify the operation and expected condition, plus a
  safe offending value or identifier when useful. Never include secrets,
  credentials, personal data, or unbounded raw payloads.
- Preserve invariants across state changes. Make transaction boundaries,
  partial-failure behavior, and retry safety explicit for stateful operations.

## Tests and testability

- Test observable behavior and contracts, not implementation details. Tests
  should survive internal refactoring that preserves behavior.
- Cover normal, boundary, invalid, and meaningful failure cases. Bug fixes
  should have regression coverage.
- Prefer table-driven or parameterized tests for related cases, with
  descriptive case names.
- Assert returned values, emitted events, persisted results, user-visible
  output, or other externally observable effects. Avoid tests that verify
  private call choreography.
- Test external systems at the appropriate level. Use fakes or contract-tested
  test doubles at unit boundaries, and focused integration tests for behavior
  that a fake cannot prove, such as serialization, queries, transactions, and
  vendor integration.
- Keep tests clear and cohesive. Test difficulty is design feedback: hard to
  test usually means a module has hidden dependencies, excessive responsibility,
  or an unclear contract.

## Refactoring and file structure

- Treat long functions, duplication, large modules, excessive conditionals,
  and tangled dependencies as signals to investigate, not automatic violations.
- Refactor in small, behavior-preserving steps protected by tests. Separate
  structural improvements from behavior changes when that makes the result
  easier to understand and review.
- Keep files focused and navigable. There is no universal file-size limit;
  split a file when ownership, cohesion, navigation, compilation, or change
  isolation suffers—not merely because it crossed an arbitrary line count.
- Preserve compatibility deliberately when changing public APIs, data formats,
  events, migrations, or persisted schemas.

## Further reading

These principles are informed by:

- *Clean Code*, Robert C. Martin — names, functions, comments, errors, and
  testable code.
- *Clean Architecture*, Robert C. Martin — boundaries, dependency direction,
  and policy independent of technical details.
- *Refactoring*, Martin Fowler with Kent Beck — code smells and small,
  behavior-preserving improvements.
- *A Philosophy of Software Design*, John Ousterhout — complexity management,
  information hiding, and deep modules.

# TDD Rules

## 1. Core Rule

Always follow the TDD cycle:

1. **RED** — Write the smallest test that fails for the intended behavior.
2. **GREEN** — Write the minimum production code required to make the test pass.
3. **REFACTOR** — Improve the design without changing behavior.
4. Run the relevant test suite after each cycle.

Never implement the behavior first and write tests afterward.

---

## 2. Test Behavior, Not Implementation

* Test observable behavior and outcomes.
* Do not test private methods, internal variables, implementation details, or call sequences unless they are part of the contract.
* Tests should survive reasonable refactoring of the implementation.
* Prefer testing through the public API of the unit under test.

Bad:

```go
assert.Equal(t, 3, service.calculateInternalTotal())
```

Good:

```go
assert.Equal(t, 300, service.CalculateOrderTotal(order))
```

---

## 3. One Behavioral Reason Per Test

Each test should verify one meaningful behavior.

Prefer:

```text
returns the total including tax
rejects an expired token
does not publish an event when persistence fails
```

Avoid tests that verify several unrelated behaviors simultaneously.

A test may contain multiple assertions when they collectively describe the same behavior.

---

## 4. Start With the Simplest Case

Implement behavior incrementally.

Typical progression:

1. Happy path
2. Important boundary conditions
3. Invalid input
4. Error handling
5. Exceptional/edge cases
6. Performance or concurrency requirements when applicable

Do not implement speculative behavior that has no failing test.

---

## 5. Keep Tests Deterministic

Tests must not depend on:

* Current time
* Randomness
* Network availability
* External services
* Machine-specific configuration
* Test execution order
* Shared mutable state

Inject sources of nondeterminism:

```go
type Clock interface {
    Now() time.Time
}
```

Use deterministic implementations in tests.

---

## 6. Minimize Test Doubles

Do not mock everything.

Prefer, in order:

1. Real in-memory implementations
2. Fakes
3. Stubs
4. Mocks

Use mocks only when interaction with an external dependency is itself part of the behavior being verified.

Avoid mocking internal collaborators merely to make unit tests easier.

---

## 7. Avoid Over-Specifying Interactions

Do not assert implementation details such as:

```text
method A must call B exactly once
B must be called before C
repository method X must receive this exact internal object
```

unless those interactions are contractual behavior.

Prefer:

```text
given X, the resulting state is Y
given X, the returned error is Z
given X, event Y is published
```

---

## 8. Tests Must Be Independent

Every test must:

* Arrange its own state.
* Avoid depending on another test.
* Be safe to run in isolation.
* Be safe to run in any order.
* Clean up resources it creates.

Never use shared mutable test state unless it is explicitly controlled and reset.

---

## 9. Make Tests Read Like Specifications

Test names should describe behavior and expected outcome.

Prefer:

```text
returnsUnauthorizedWhenTokenIsExpired
publishesInvoiceCreatedEventAfterSuccessfulPersistence
rejectsOrderWhenCustomerHasInsufficientCredit
```

Avoid:

```text
testCalculate
testService
testCase1
shouldWork
```

Use Arrange → Act → Assert structure:

```go
// Arrange
order := newOrder()

// Act
result, err := service.Process(order)

// Assert
require.NoError(t, err)
assert.Equal(t, expected, result)
```

Keep each section obvious.

---

## 10. Keep Tests Fast

The default test suite should execute quickly.

* Unit tests should be milliseconds-scale where practical.
* Avoid unnecessary I/O.
* Avoid starting infrastructure for tests that do not require it.
* Separate slower integration/e2e tests from the unit suite.
* Run focused tests during the TDD loop.

Fast feedback is a core requirement of TDD.

---

## 11. Use Integration Tests Where Boundaries Matter

Unit tests do not replace integration tests.

Use integration tests to verify:

* Database behavior
* SQL queries
* Transactions
* Serialization/deserialization
* HTTP contracts
* Message brokers
* External system integration
* Dependency configuration

Do not mock a database query so heavily that the test verifies the mock instead of the query.

---

## 12. Test Error Paths Explicitly

Every meaningful failure mode should have a test.

Examples:

```text
dependency unavailable
invalid input
not found
duplicate resource
authorization failure
transaction failure
timeout
partial failure
```

Do not rely on happy-path tests to implicitly cover error handling.

---

## 13. Preserve Error Semantics

Tests should verify meaningful error behavior:

* Correct error type/category
* Correct domain error
* Correct wrapping/unwrapping behavior
* Appropriate HTTP/status mapping where applicable

Avoid asserting fragile error strings unless the exact message is part of the contract.

---

## 14. Refactor Only After GREEN

Never mix behavioral changes with refactoring.

Correct:

```text
RED → GREEN → REFACTOR
```

During refactoring:

* Tests must remain green.
* Do not add new behavior.
* Do not change requirements.
* Improve naming, structure, duplication, abstractions, and complexity.

If a refactor requires changing tests because the tests were coupled to implementation details, improve the tests.

---

## 15. Do Not Write Tests Solely for Coverage

Code coverage is a diagnostic metric, not the goal.

Do not:

* Add meaningless assertions to increase coverage.
* Test trivial getters/setters solely for coverage.
* Create tests that execute code without verifying behavior.

Prioritize coverage of important behavior, boundaries, failure modes, and business rules.

---

## 16. Do Not Add Abstractions Without a Reason

TDD does not mean creating interfaces everywhere.

Introduce an abstraction when there is a concrete design reason:

* Multiple implementations
* External dependency isolation
* Architectural boundary
* Required substitution in tests
* Independent evolution of components

Do not create interfaces merely because "interfaces make code testable."

---

## 17. Tests Are Production Code

Apply the same engineering standards to tests as production code.

Tests must have:

* Clear naming
* Small functions
* Minimal duplication
* Proper abstractions
* No dead code
* No unexplained magic values
* Consistent formatting
* Maintainable structure

A bad test suite is technical debt.

---

## 18. Fix Broken Tests Immediately

Never:

* Ignore a failing test.
* Disable a test without a documented reason.
* Comment out assertions.
* Add retries to hide flaky behavior.
* Accept known flaky tests as normal.

A failing test means one of three things:

1. The implementation is wrong.
2. The test is wrong.
3. The requirement changed.

Determine which one and fix it immediately.

---

## 19. Regression Rule

Every bug fix must include a regression test.

Process:

```text
Reproduce bug with a failing test
        ↓
Fix implementation
        ↓
Verify test passes
        ↓
Keep regression test permanently
```

Never fix a reproducible bug without encoding it into the test suite.

---

## 20. Property-Based Testing

Use property-based testing when behavior is better expressed through invariants than individual examples.

Good candidates:

* Parsers
* Serialization
* Mathematical transformations
* Data normalization
* Collections
* State transitions
* Idempotency

Example invariant:

```text
deserialize(serialize(x)) == x
```

---

## 21. Contract Testing

For service boundaries, test contracts independently of implementation.

Verify:

* Request schema
* Response schema
* Required fields
* Error contracts
* Compatibility requirements

Contract tests are especially valuable for APIs and event-driven systems.

---

## 22. TDD Is Not an Excuse for Poor Design

If code is difficult to test, first question the design.

Common warning signs:

* Huge constructors
* Excessive dependencies
* Global state
* Hidden I/O
* Static dependencies
* Deeply coupled modules
* Large functions
* Mixed business logic and infrastructure

Do not solve structural problems by adding increasingly complex mocks.

Refactor the design.

---

## 23. Definition of Done

A behavioral change is complete only when:

* A test existed that failed before the implementation.
* The implementation makes the test pass.
* Relevant edge cases are covered.
* Relevant failure paths are covered.
* Tests are deterministic.
* Tests are independent.
* The implementation has been refactored where necessary.
* The relevant test suite passes.
* The full regression suite passes.
* No test has been weakened or disabled to obtain GREEN.

---

## 24. TDD Decision Rule

Before writing production code, ask:

> "What observable behavior am I implementing, and what test currently proves that this behavior is missing?"

If there is no clear answer, do not write the production code yet.

# Golang idioms

## Error Handling
**Explicit error checking** is fundamental:
```go
// Idiomatic - check errors immediately
result, err := someFunction()
if err != nil {
    return err
}
```

The "return early" pattern is common:
```go
func processFile(filename string) error {
    file, err := os.Open(filename)
    if err != nil {
        return fmt.Errorf("open file: %w", err)
    }
    defer file.Close()
    
    // ... processing logic
    return nil
}
```

## Interface Design
**Minimal interfaces** - prefer small, focused interfaces:
```go
type Reader interface {
    Read(p []byte) (n int, err error)
}

type Writer interface {
    Write(p []byte) (n int, err error)
}
```

## Slices and Arrays
**Zero values matter** - empty slices are nil:
```go
var slice []int  // nil slice, not empty slice
slice = make([]int, 0)  // empty slice with length 0
slice = []int{}         // empty slice literal
```

**Growing slices efficiently**:
```go
// Pre-allocate when you know the size
slice := make([]string, 0, expectedSize)

// Or use append for dynamic growth
slice = append(slice, newItem)
```

## Defer Pattern
**Resource management** using defer:
```go
func readFile(filename string) ([]byte, error) {
    file, err := os.Open(filename)
    if err != nil {
        return nil, err
    }
    defer file.Close()  // Always closes even if error occurs
    
    return io.ReadAll(file)
}
```

## Method Receivers
**Value vs pointer receivers** - choose based on needs:
```go
// Use value receiver for small types that shouldn't be modified
func (v Value) String() string { }

// Use pointer receiver when modifying the receiver
func (v *Value) Set(value int) { }
```

## Goroutines and Channels
**Concurrent programming idiom**:
```go
// Fan-out pattern - multiple goroutines
func worker(jobs <-chan int, results chan<- int) {
    for j := range jobs {
        // process job
        results <- processed
    }
}
```

## Zero Values and Initialization
**Use zero values where appropriate**:
```go
// No need to explicitly initialize to zero values
var (
    counter int     // 0
    name    string  // ""
    active  bool    // false
    items   []int   // nil
)
```

## Struct Embedding
**Composition over inheritance**:
```go
type Engine struct {
    Horsepower int
}

type Car struct {
    Engine  // Embedded
    Wheels  int
}
```

## Error Wrapping
**Modern error handling with %w**:
```go
func process() error {
    err := someOperation()
    if err != nil {
        return fmt.Errorf("process failed: %w", err)
    }
    return nil
}
```

## Named Returns
**Named return variables** can improve clarity:
```go
func readConfig(filename string) (config Config, err error) {
    file, err := os.Open(filename)
    if err != nil {
        return  // named returns automatically returned
    }
    defer file.Close()
    
    // ... parse config
    return config, nil
}
```

## Cancellation Context
**Context for cancellation**:
```go
ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
defer cancel()

select {
case result := <-workChan:
    // handle result
case <-ctx.Done():
    return ctx.Err()
}
```

These idioms collectively create Go's signature style: explicit yet concise, simple yet powerful. They're designed around the principle that "explicit is better than implicit" while maintaining readability and reliability.

# Git Commit with Conventional Commits

## Overview

Create standardized, semantic git commits using the Conventional Commits specification. Analyze the actual diff to determine appropriate type, scope, and message.

## Conventional Commit Format

```
<type>[optional scope]: <description>

[optional body]

[optional footer(s)]
```

## Commit Types

| Type       | Purpose                        |
| ---------- | ------------------------------ |
| `feat`     | New feature                    |
| `fix`      | Bug fix                        |
| `docs`     | Documentation only             |
| `style`    | Formatting/style (no logic)    |
| `refactor` | Code refactor (no feature/fix) |
| `perf`     | Performance improvement        |
| `test`     | Add/update tests               |
| `build`    | Build system/dependencies      |
| `ci`       | CI/config changes              |
| `chore`    | Maintenance/misc               |
| `revert`   | Revert commit                  |

## Breaking Changes

```
# Exclamation mark after type/scope
feat!: remove deprecated endpoint

# BREAKING CHANGE footer
feat: allow config to extend other configs

BREAKING CHANGE: `extends` key behavior changed
```

## Workflow

### 1. Analyze Diff

```bash
# If files are staged, use staged diff
git diff --staged

# If nothing staged, use working tree diff
git diff

# Also check status
git status --porcelain
```

### 2. Stage Files (if needed)

If nothing is staged or you want to group changes differently:

```bash
# Stage specific files
git add path/to/file1 path/to/file2

# Stage by pattern
git add *.test.*
git add src/components/*

# Interactive staging
git add -p
```

**Never commit secrets** (.env, credentials.json, private keys).

### 3. Generate Commit Message

Analyze the diff to determine:

- **Type**: What kind of change is this?
- **Scope**: What area/module is affected?
- **Description**: One-line summary of what changed (present tense, imperative mood, <72 chars)

### 4. Execute Commit

```bash
# Single line
git commit -m "<type>[scope]: <description>"

# Multi-line with body/footer
git commit -m "$(cat <<'EOF'
<type>[scope]: <description>

<optional body>

<optional footer>
EOF
)"
```

## Best Practices

- One logical change per commit
- Present tense: "add" not "added"
- Imperative mood: "fix bug" not "fixes bug"
- Reference issues: `Closes #123`, `Refs #456`
- Keep description under 72 characters

## Git Safety Protocol

- NEVER update git config
- NEVER run destructive commands (--force, hard reset) without explicit request
- NEVER skip hooks (--no-verify) unless user asks
- NEVER force push to main/master
- If commit fails due to hooks, fix and create NEW commit (don't amend)
"""
